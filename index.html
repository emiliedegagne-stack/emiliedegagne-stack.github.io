<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Reading Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>📚 My Reading Dashboard</h1>

<!-- Language Toggle -->
<div id="language-toggle">
  <button onclick="setLanguage('en')">English</button>
  <button onclick="setLanguage('fr')">Français</button>
</div>

<!-- Filters -->
<div id="filters">
  <input type="text" id="searchInput" placeholder="Search books..." oninput="renderBooks()">
  
  <select id="yearFilter" onchange="renderBooks()">
    <option value="">All Years</option>
  </select>

  <select id="genreFilter" onchange="renderBooks()">
    <option value="">All Genres</option>
  </select>

  <select id="langFilter" onchange="renderBooks()">
    <option value="">All Languages</option>
    <option value="fr">Français</option>
    <option value="en">English</option>
    <option value="both">Both</option>
  </select>
</div>

<!-- Stats -->
<div id="stats">
  <div id="totalBooks"></div>
  <div id="avgRating"></div>
  <div id="booksPerYear"></div>
</div>

<!-- Charts -->
<div id="charts">
  <canvas id="booksPerYearChart"></canvas>
  <canvas id="genreChart"></canvas>
</div>

<!-- Book Cards -->
<div id="booksContainer"></div>

<!-- Script -->
<script src="script.js"></script>
</body>
</html>
